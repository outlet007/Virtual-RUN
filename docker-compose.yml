services:
  virtual-run:
    container_name: Virtual-RUN
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: virtual-run:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
